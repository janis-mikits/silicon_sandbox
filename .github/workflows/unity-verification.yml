name: Unity verification

# Runner labels, activated Editor licenses, and UNITY_EDITOR_* variables must be
# configured before this workflow can run. The public repository has no dedicated
# runners yet, so dispatch is manual and no CI result is claimed by this file.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: [self-hosted, macOS, unity-6000-3-24f1]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify tests and macOS build
        env:
          UNITY_EDITOR_MAC: ${{ vars.UNITY_EDITOR_MAC }}
        run: ./scripts/verify-unity.sh --editor "$UNITY_EDITOR_MAC" --target StandaloneOSX
      - name: Upload verification records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unity-macos-verification
          path: UnityProject/Logs/Verification/
          if-no-files-found: warn

  windows:
    runs-on: [self-hosted, Windows, unity-6000-3-24f1]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify tests and Windows build
        shell: pwsh
        env:
          UNITY_EDITOR_WINDOWS: ${{ vars.UNITY_EDITOR_WINDOWS }}
        run: .\scripts\verify-unity.ps1 -Editor $env:UNITY_EDITOR_WINDOWS -Target StandaloneWindows64
      - name: Upload verification records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unity-windows-verification
          path: UnityProject/Logs/Verification/
          if-no-files-found: warn
